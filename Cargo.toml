[package]
name = "dig-rpc"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Axum-based JSON-RPC server framework for a DIG node. Serves the dig-rpc-protocol interface over mTLS (peer) / HTTPS (public read) / loopback (control), with tier-based method allow-lists, per-peer rate limiting, and graceful shutdown. The node supplies a handler; this crate owns the transport + envelope + boundary."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DIG-Network/dig-rpc"
homepage = "https://github.com/DIG-Network/dig-rpc"
documentation = "https://docs.rs/dig-rpc"
readme = "README.md"
keywords = ["dig-network", "json-rpc", "axum", "mtls", "rpc"]
categories = ["web-programming::http-server", "cryptography::cryptocurrencies"]
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "SPEC.md",
    "LICENSE*",
]

[dependencies]
# The canonical wire contract — the ONLY DIG dependency. No node/service crate.
# dig-rpc-types was renamed + superseded by dig-rpc-protocol v0.3 (yanked on
# crates.io); this crate now depends on the canonical crates.io release.
dig-rpc-protocol = "0.5"

# HTTP stack.
axum = { version = "0.7", features = ["http1", "http2", "json"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }

# TLS / mTLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"

# Serde + async trait.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# Utilities.
tracing = "0.1"
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[features]
default = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
